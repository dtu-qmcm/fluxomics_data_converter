[project]
name = "fluxomics-data-converter"
version = "0.1.0"
description = "A Python library for converting fluxomics data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.4.23",
    "jaxlib>=0.4.23",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pydantic>=2.10.4",
    "sbmlmath>=0.4.0",
    "sympy>=1.13.3",
]
authors = [
  {name = "Teddy Groves", email = "tedgro@dtu.dk"},
  {name = "Sergi Muyo Abad", email = "smuyo@dtu.dk"},
  {name = "Te Chen", email = "techen@dtu.dk"},
]
license = {text = "MIT"}

[project.scripts]
# Needs the `linkml` extra (FluxoLink) for every command.
fluxo = "fluxomics_data_converter.cli:main"

[project.optional-dependencies]
# FluxoLink records (fluxomics_data_converter.link) and the fluxo CLI
linkml = ["fluxolink"]

[tool.uv.sources]
# The FluxoLink schema package, pinned to one commit of its GitHub repository
# so every checkout and CI run gets the same schema. Move the pin when the
# converter needs a newer schema. To try a local schema checkout without
# moving it: uv run --with-editable ../fluxomics_linkml pytest
fluxolink = { git = "https://github.com/dtu-qmcm/fluxomics_linkml", rev = "d9c0be01f1770d31804c18b37799ca67b96e8976" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
plugins = ['pydantic.mypy']

[tool.ruff]
extend-exclude = ["data"]
line-length = 80

[tool.ruff.lint]
# F722  – forward annotation syntax (suppressed for Pydantic compat)
# D106  – undocumented nested class (fires on every Pydantic `Config` inner
#          class; those are boilerplate and should not require a docstring)
ignore = ["F722", "D106"]

extend-select = [
    "E501",  # line length is checked
    "D",     # pydocstyle – enforces Google-style docstring conventions
]

[tool.ruff.lint.per-file-ignores]
# Ignore all directories named `tests`.
"tests/**" = ["D"]
# Ignore all files that end in `_test.py`.
"*_test.py" = ["D"]

[tool.ruff.lint.pydocstyle]
# "google" activates the canonical Google-style rule subset:
#   - Requires summary on the first line (D212), not the second (D213)
#   - Requires imperative mood (D401) is disabled for Google convention
#   - Blank line after last section (D413) is disabled for Google convention
#   - One-line docstrings must fit on one line (D200)
#   - First line must end with a period/question mark/exclamation (D415)
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["fluxomics_data_converter"]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.5",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.49",
    "mkdocstrings>=0.27.0",
    "mkdocstrings-python>=1.13.0",
    "pymdown-extensions>=10.14",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "mypy>=1.0.0",
    "ruff>=0.3.0",
]
